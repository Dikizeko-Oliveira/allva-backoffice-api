# Infraestrutura local do backoffice-api: só o banco PRÓPRIO dele.
#
# Porta 5433 de propósito: o Postgres do `allva-api` costuma estar na 5432, e os
# dois bancos são independentes (históricos de migração separados).
services:
  postgres:
    image: postgres:15
    container_name: allva-backoffice-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: allva_backoffice_db
      POSTGRES_USER: allva_backoffice_user
      POSTGRES_PASSWORD: allva_backoffice_password
    volumes:
      - backoffice_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  backoffice_postgres_data:
