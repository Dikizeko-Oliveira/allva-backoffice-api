version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: local-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: allva_db
      POSTGRES_USER: allva_user
      POSTGRES_PASSWORD: allva_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: local-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  postgres_data:
