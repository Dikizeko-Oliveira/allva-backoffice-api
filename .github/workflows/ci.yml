name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch cancela a run anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Críticas em `env.ts`: sem elas o `EnvModule` derruba a montagem do
      # AppModule em `application-graph.spec.ts`. Nenhum passo deste job abre
      # conexão nem chama o allva-api — valores descartáveis de propósito.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      ALLVA_API_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      # Lê a versão do campo `packageManager` do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O postinstall já roda isso; explícito porque um install com
      # `--ignore-scripts` deixaria `generated/prisma` faltando e o tsc quebraria
      # com um erro que não aponta para a causa.
      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:ci

      # Unitários + gates de arquitetura (camadas, autorização por use case,
      # grafo de injeção). Nenhum precisa de infraestrutura.
      - name: Tests
        run: pnpm test:cov

  migrations:
    name: Migrações num banco limpo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: allva_backoffice_ci
          POSTGRES_USER: allva_backoffice_ci
          POSTGRES_PASSWORD: allva_backoffice_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://allva_backoffice_ci:allva_backoffice_ci@localhost:5432/allva_backoffice_ci?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `migrate deploy`, nunca `db push`: é o mesmo caminho da produção.
      - name: Apply migrations
        run: pnpm prisma migrate deploy

      # O histórico de migração e o `schema.prisma` descrevem o mesmo banco.
      # Sem isto, um campo novo no schema sem migration passa no typecheck e só
      # quebra no deploy.
      - name: Schema matches migrations
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
