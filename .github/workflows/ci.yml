name: CI

# Roda em todo PR e em todo push em `main` — o deploy (`deploy.yml`) dispara no
# mesmo push, então o resultado desta run é o que valida a revisão publicada.

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch cancela a run anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Críticas em `env.ts`: sem elas o `EnvModule` derruba a montagem do
      # AppModule em `application-graph.spec.ts`. Nenhum passo deste job abre
      # conexão nem chama o allva-api — valores descartáveis de propósito.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      ALLVA_API_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      # Lê a versão do campo `packageManager` do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O postinstall já roda isso; explícito porque um install com
      # `--ignore-scripts` deixaria `generated/prisma` faltando e o tsc quebraria
      # com um erro que não aponta para a causa.
      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:ci

      # Unitários + gates de arquitetura (camadas, autorização por use case,
      # grafo de injeção). Nenhum precisa de infraestrutura.
      - name: Tests
        run: pnpm test:cov

      # Roda mesmo quando os testes falham: o número que reprovou é justamente o
      # que o revisor precisa ver sem abrir o log.
      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  migrations:
    name: Migrações num banco limpo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: allva_backoffice_ci
          POSTGRES_USER: allva_backoffice_ci
          POSTGRES_PASSWORD: allva_backoffice_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://allva_backoffice_ci:allva_backoffice_ci@localhost:5432/allva_backoffice_ci?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `migrate deploy`, nunca `db push`: é o mesmo caminho da produção.
      - name: Apply migrations
        run: pnpm prisma migrate deploy

      # O histórico de migração e o `schema.prisma` descrevem o mesmo banco.
      # Sem isto, um campo novo no schema sem migration passa no typecheck e só
      # quebra no deploy.
      - name: Schema matches migrations
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  # A imagem é o que o deploy publica. Construí-la aqui faz um Dockerfile
  # quebrado (lockfile fora de sincronia, arquivo não copiado, `prisma generate`
  # falhando) reprovar no PR, e não depois do merge, no meio do deploy.
  # Só constrói: não faz push nem autentica em nada.
  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t allva-backoffice-api:ci .
