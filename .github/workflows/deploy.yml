name: Deploy

# **Só manual até a infraestrutura própria existir.**
#
# Este arquivo veio copiado do `allva-api` apontando para o serviço
# `allva-backend`, a imagem `allva/backend` e o secret `DATABASE_URL` do produto:
# o primeiro push em `main` teria **substituído o backend do produto** pela
# imagem do backoffice e rodado as migrações daqui no banco do cliente.
#
# Antes de religar o gatilho de push, criar no GCP (projeto allva-staging):
#   - serviço Cloud Run `allva-backoffice-api` e job `allva-backoffice-api-migrate`
#   - service account `allva-backoffice-api@…` com secretAccessor nos dois secrets
#   - secret `BACKOFFICE_DATABASE_URL` (banco próprio, não o `allva-postgres`)
#   - secret `BACKOFFICE_ALLVA_API_URL` (URL interna do allva-api)
on:
  workflow_dispatch: {}

# Um deploy em andamento nunca é cancelado por outro: cancelar no meio poderia
# deixar a migration aplicada e o serviço ainda na revisão antiga.
concurrency:
  group: deploy-backoffice-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation: OIDC do GitHub → credencial GCP

env:
  PROJECT_ID: allva-staging
  REGION: southamerica-east1
  SERVICE: allva-backoffice-api
  IMAGE: southamerica-east1-docker.pkg.dev/allva-staging/allva/backoffice-api
  RUNTIME_SERVICE_ACCOUNT: allva-backoffice-api@allva-staging.iam.gserviceaccount.com
  MIGRATE_JOB: allva-backoffice-api-migrate
  VPC_NETWORK: default
  VPC_SUBNET: default
  VPC_EGRESS: private-ranges-only

jobs:
  deploy:
    name: Build, migrate & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Job separado do serviço: se a migration falhar, o deploy não roda e
      # nenhuma instância sobe esperando um schema que não existe.
      - name: Create/update migration job
        run: |
          gcloud run jobs deploy ${{ env.MIGRATE_JOB }} \
            --quiet \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --service-account ${{ env.RUNTIME_SERVICE_ACCOUNT }} \
            --network ${{ env.VPC_NETWORK }} \
            --subnet ${{ env.VPC_SUBNET }} \
            --vpc-egress ${{ env.VPC_EGRESS }} \
            --set-secrets DATABASE_URL=BACKOFFICE_DATABASE_URL:latest \
            --command pnpm \
            --args prisma,migrate,deploy \
            --max-retries 0 \
            --task-timeout 600

      - name: Run migrations
        run: |
          gcloud run jobs execute ${{ env.MIGRATE_JOB }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --quiet \
            --project ${{ env.PROJECT_ID }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SERVICE_ACCOUNT }} \
            --network ${{ env.VPC_NETWORK }} \
            --subnet ${{ env.VPC_SUBNET }} \
            --vpc-egress ${{ env.VPC_EGRESS }} \
            --set-secrets DATABASE_URL=BACKOFFICE_DATABASE_URL:latest,ALLVA_API_URL=BACKOFFICE_ALLVA_API_URL:latest \
            --port 8081 \
            --allow-unauthenticated
